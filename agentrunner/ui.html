<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>AgentRunner 任务</title>
  <style>
    body{font:15px/1.5 system-ui,sans-serif;max-width:1100px;margin:2rem auto;padding:0 1rem;color:#17212b;background:#f5f7fa}
    h1{font-size:1.6rem} main{display:grid;grid-template-columns:minmax(250px,1fr) minmax(350px,2fr);gap:1rem}
    section{background:white;border:1px solid #dbe2e9;border-radius:10px;padding:1rem;min-width:0}
    button{font:inherit;cursor:pointer} .job{display:block;width:100%;text-align:left;padding:.65rem;margin:.35rem 0;border:1px solid #dbe2e9;border-radius:6px;background:white}
    .job:hover{background:#eff6ff} .muted{color:#64748b} pre{white-space:pre-wrap;overflow-wrap:anywhere;background:#f3f5f7;padding:.7rem;border-radius:6px;max-height:18rem;overflow:auto}
    .actions{display:flex;gap:.5rem;align-items:center} #error{color:#9a3412} @media(max-width:750px){main{grid-template-columns:1fr}}
  </style>
</head>
<body>
  <h1>AgentRunner</h1>
  <p class="muted">本地任务状态。页面关闭不会结束任务。</p>
  <p class="muted">原聊天回调仅在提交时指定聊天 ID 且本机 Codex CLI 可入队时尝试；入队成功不保证恰好一次唤醒。</p>
  <p id="error" role="alert"></p>
  <main>
    <section><h2>任务</h2><div id="jobs"></div></section>
    <section>
      <h2 id="title">选择任务</h2>
      <div class="actions"><span id="status"></span><button id="cancel" hidden>取消任务</button></div>
      <p id="callback" class="muted"></p>
      <pre id="detail"></pre>
      <h3>步骤</h3><div id="steps"></div>
      <h3>标准输出</h3><pre id="stdout"></pre>
      <h3>错误输出</h3><pre id="stderr"></pre>
      <h3>事件</h3><pre id="events"></pre>
    </section>
  </main>
  <script>
    const params=new URLSearchParams(location.hash.slice(1));
    if(params.has('token')){sessionStorage.setItem('runnerToken',params.get('token'));history.replaceState(null,'',location.pathname)}
    let token=sessionStorage.getItem('runnerToken');
    if(!token){token=prompt('请输入 runner ui 显示的本地访问令牌');if(token)sessionStorage.setItem('runnerToken',token)}
    let selected=null, selectedStep=null;
    async function api(path, options={}){
      const response=await fetch('/api/'+path,{...options,headers:{'Authorization':'Bearer '+token,'Content-Type':'application/json'}});
      const data=await response.json();if(!response.ok)throw new Error(data.error||response.status);return data;
    }
    async function refresh(){
      try{
        const data=await api('jobs'); const container=document.getElementById('jobs');container.replaceChildren();
        for(const job of data.jobs){
          const button=document.createElement('button');button.className='job';
          button.textContent=job.id+' · '+job.status+' · '+job.created_at;
          button.onclick=()=>{selected=job.id;selectedStep=null;refresh()};container.append(button);
        }
        if(selected){
          const job=await api('jobs/'+encodeURIComponent(selected));
          document.getElementById('title').textContent=job.id;
          document.getElementById('status').textContent=job.status+' · exit '+(job.exit_code??'—');
          const callbackText=!job.callback_thread?'未配置回调':{
            NOT_REQUESTED:'等待任务终态',PENDING:'等待入队',SENDING:'正在入队',
            SENT:'已向原聊天入队',UNKNOWN:'入队结果未确认；Service 运行时将重试'
          }[job.callback_status]||job.callback_status;
          document.getElementById('callback').textContent='Codex 回调：'+callbackText;
          const selectedRow=(job.steps||[]).find(step=>step.step_id===selectedStep);
          document.getElementById('detail').textContent=JSON.stringify(selectedRow||{cwd:job.cwd,command:job.command,started_at:job.started_at,finished_at:job.finished_at,error:job.error},null,2);
          document.getElementById('events').textContent=JSON.stringify(job.events,null,2);
          const steps=document.getElementById('steps');steps.replaceChildren();
          for(const step of job.steps||[]){
            const button=document.createElement('button');button.className='job';
            button.textContent=step.step_id+' · '+step.status+' · attempt '+step.attempts;
            button.onclick=()=>{selectedStep=step.step_id;refresh()};steps.append(button);
          }
          const logBase='jobs/'+encodeURIComponent(selected)+(selectedStep?'/steps/'+encodeURIComponent(selectedStep):'')+'/logs?stream=';
          const logs=await Promise.all(['stdout','stderr'].map(stream=>api(logBase+stream)));
          document.getElementById('stdout').textContent=logs[0].tail;
          document.getElementById('stderr').textContent=logs[1].tail;
          document.getElementById('cancel').hidden=!['CREATED','RUNNING'].includes(job.status);
        }
        document.getElementById('error').textContent='';
      }catch(error){document.getElementById('error').textContent=String(error)}
    }
    document.getElementById('cancel').onclick=async()=>{if(selected&&confirm('取消 '+selected+'？')){await api('jobs/'+encodeURIComponent(selected)+'/cancel',{method:'POST'});refresh()}};
    refresh();setInterval(refresh,3000);
  </script>
</body>
</html>
