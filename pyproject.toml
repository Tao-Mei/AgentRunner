[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "agentrunner"
version = "0.2.0.dev0"
description = "Local deterministic task runner for AI coding agents"
readme = "README.md"
license = {text = "Apache-2.0"}
requires-python = ">=3.11"
dependencies = ["psutil>=5.9", "PyYAML>=6.0"]

[project.optional-dependencies]
desktop = ["PySide6>=6.11,<7"]

[project.scripts]
runner = "agentrunner.cli:main"

[tool.setuptools.packages.find]
include = ["agentrunner*"]

[tool.setuptools.package-data]
agentrunner = ["ui.html", "README.md", "structure.md", "contract.md", "assets/*.png", "assets/*.ico"]
